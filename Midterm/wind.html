<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>The Wind Rises</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #0f2f3a;
            color: white;
            font-family: Poppins;
        }

        .hero {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 380px;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 0;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .details-box {
            background: #08202a;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .nav-link-custom {
            color: white;
            text-decoration: none;
        }

        .nav-link-custom:hover {
            color: gold;
        }

        .hero-text {
            position: absolute;
            top: 0;
            left: 0;
            padding: 16px;
            max-width: 600px;
        }

        #popularList {
            scrollbar-width: none;
        }

        #popularList::-webkit-scrollbar {
            display: none;
        }

        #popularList img {
            width: 120px;
            height: 280px;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.3s;
        }

        #popularList img:hover {
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg px-4" style="background:#08202a;">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold fs-3" href="#" style="color:gold;">
                Ghibli Films
            </a>

            <div class="d-flex gap-4">
                <a href="index.html" class="nav-link-custom">Home</a>
                <a href="Movies.html" class="nav-link-custom">Movies</a>
            </div>

        </div>
    </nav>

    <div class="container-fluid py-4">

        <div class="row g-4 align-items-start">

            <!-- LEFT -->
            <div class="col-md-auto ms-4">

                <div style="width:300px;">

                    <a href="Movies.html" class="text-warning text-decoration-none d-block mb-2">←</a>

                    <img id="poster" class="w-100 rounded"
                        style="height:380px; object-fit:cover;">

                    <div class="details-box mt-3">
                        <h6 class="text-warning">Details</h6>

                        <p class="mb-1"><span class="text-secondary">Director:</span> <span id="director"></span></p>
                        <p class="mb-1"><span class="text-secondary">Producer:</span> <span id="producer"></span></p>
                        <p class="mb-1"><span class="text-secondary">Release:</span> <span id="release"></span></p>
                        <p class="mb-0"><span class="text-secondary">Runtime:</span> <span id="runtime"></span> min</p>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="col d-flex flex-column" style="margin-top:50px;">

                <div class="hero">

                    <img id="heroImage">

                    <div class="overlay"></div>

                    <div class="hero-text">

                        <h1 id="title" class="fw-bold"></h1>

                        <h5 id="subtitle" class="text-warning"></h5>

                        <p id="description" class="text-light mt-2"></p>

                        <h5 id="rating" class="mt-2"></h5>

                        <a href="https://www.youtube.com/watch?v= eJ3WYCZuKbA?"
                            class="btn btn-warning mt-3 fw-semibold"
                            target="_blank">
                            ▶ Watch Movie
                        </a>

                    </div>

                </div>

                <!-- TRAILER + POPULAR -->
                <div class="row mt-4">

                    <div class="col-md-8">
                        <h3 style="color:gold;">Trailer</h3>

                        <iframe width="100%" height="315"
                            src="https://www.youtube.com/embed/RzSpDgiF5y8?si=j4yV7_2_2i1ZgaU_"
                            allowfullscreen></iframe>
                    </div>

                    <div class="col-md-4">
                        <h3 style="color:gold;">Popular</h3>

                        <div id="popularList" style="
                            display:flex;
                            gap:12px;
                            overflow-x:auto;
                            height:315px;
                            align-items:flex-start;
                            padding-bottom:10px;
                            scrollbar-width:none;
                        "></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        async function loadMovie() {

            const res = await fetch("https://ghibliapi.vercel.app/films");
            const films = await res.json();

            const film = films.find(movie => movie.title === "The Wind Rises");

            poster.src = film.image;
            heroImage.src = film.movie_banner;
            title.textContent = film.title;
            description.textContent = film.description;

            subtitle.innerHTML =
                `${film.release_date} / Animation / ${film.running_time} min`;

            rating.innerHTML =
                `⭐⭐⭐⭐⭐ ${film.rt_score}/100`;

            director.textContent = film.director;
            producer.textContent = film.producer;
            release.textContent = film.release_date;
            runtime.textContent = film.running_time;

            const popular = films.slice(0, 6);

            popular.forEach(movie => {

                let fileName = "#";

                if (movie.title === "Only Yesterday") {
                    fileName = "yesterday.html";
                }

                else if (movie.title === "My Neighbor Totoro") {
                    fileName = "totoro.html";
                }

                else if (movie.title === "Grave of the Fireflies") {
                    fileName = "Grave.html";
                }

                else if (movie.title === "Kiki's Delivery Service") {
                    fileName = "kiki's.html";
                }

                else if (movie.title === "Castle in the Sky") {
                    fileName = "Castle.html";
                }

                else if (movie.title === "Porco Rosso") {
                    fileName = "porco.html";
                }

                popularList.innerHTML += `
        <a href="${fileName}">
            <img src="${movie.image}" alt="${movie.title}">
        </a>
    `;
            });
        }

        loadMovie();
    </script>

</body>
</html>
