<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movies</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body[data-bs-theme="light"] {
            background: #f5f5f5;
            color: black;
        }

        body[data-bs-theme="dark"] {
            background: #0f2f3a;
            color: white;
        }

        .section {
            padding: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            border-radius: 15px;
            width: 220px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        body[data-bs-theme="light"] .card {
            background: #143c4a;
            color: white;
        }

        body[data-bs-theme="dark"] .card {
            background: white;
            color: black;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 10px;
        }

        .card-content h4 {
            font-size: 13px;
        }

        .card a {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        body[data-bs-theme="light"] .navbar {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        body[data-bs-theme="dark"] .navbar {
            background: #08202a;
        }

        .nav-link-custom {
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        body[data-bs-theme="light"] .nav-link-custom {
            color: black;
        }

        body[data-bs-theme="dark"] .nav-link-custom {
            color: white;
        }

        .nav-link-custom:hover {
            color: gold;
        }

        .btn {
            background: gold;
            color: black;
            font-weight: 600;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d4af37;
        }
    </style>
</head>

<body id="body" data-bs-theme="light">


    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold" href="#" style="color:gold;">
                Studio Ghibli
            </a>

            <!-- NAV LINKS -->
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="nav-link-custom">Home</a>

                <button id="modeBtn" onclick="switchTheme()" class="btn gold-btn">
                    Dark Mode
                </button>
            </div>

        </div>
    </nav>

    <style>
        .nav-link-custom {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link-custom:hover {
            color: gold;
        }
    </style>

    <!-- MOVIES -->
    <section class="section">
        <h3>Movies</h3>

        <div class="cards" id="movieContainer"></div>
    </section>

    <script>
        const endpoint = "https://ghibliapi.vercel.app/films/";
        const container = document.getElementById("movieContainer");

        const pages = {
            "My Neighbors the Yamadas": "Yamadas.html",
            "Castle in the Sky": "Castle.html",
            "Whisper of the Heart": "whisper.html",
            "Spirited Away": "spirited.html",
            "Princess Mononoke": "Princess.html",
            "The Cat Returns": "Cat.html",
            "When Marnie Was There": "Marnie.html",
            "Kiki's Delivery Service": "kiki's.html",
            "Only Yesterday": "yesterday.html",
            "Porco Rosso": "porco.html",
            "Ponyo": "ponyo.html",
            "Howl's Moving Castle": "howls.html",
            "Earwig and the Witch": "earwig_witch.html",
            "My Neighbor Totoro": "totoro.html",
            "Arrietty": "arrietty.html",
            "The Red Turtle": "turtle.html",
            "Tales from Earthsea": "Earthsea.html",
            "Grave of the Fireflies": "Grave.html",
            "The Wind Rises": "wind.html",
            "Pom Poko": "poko.html",
            "From Up on Poppy Hill": "poppy_hill.html",
            "The Tale of the Princess Kaguya": "Princess_kaguya.html"


        };

        fetch(endpoint)
            .then(res => res.json())
            .then(data => {

                container.innerHTML = "";

                data.forEach(movie => {

                    const card = document.createElement("div");
                    card.className = "card";

                    let page = pages[movie.title] || "#";

                    card.innerHTML = `
                    <a href="${page}">
                        <div class="card-content">
                            <img src="${movie.image}">
                            <h4>${movie.title}</h4>
                        </div>
                    </a>
                `;

                    container.appendChild(card);
                });

            })
            .catch(err => console.log(err));

        var body = document.getElementById("body");
        var modeBtn = document.getElementById("modeBtn");

        var mode = body.getAttribute("data-bs-theme") === "dark" ? "Dark" : "Light";
        modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

        function switchTheme() {
            if (mode == "Light") {
                mode = "Dark";
                modeBtn.innerText = "Light Mode";
            } else {
                mode = "Light";
                modeBtn.innerText = "Dark Mode";
            }

            body.setAttribute("data-bs-theme", mode.toLowerCase());
        }
    </script>

</body>

</html>
