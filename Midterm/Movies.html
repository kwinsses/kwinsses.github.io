<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movies</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f2f3a;
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }

        .section {
            padding: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            color: black;
            border-radius: 15px;
            width: 250px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 10px;
        }

        .card-content h4 {
            font-size: 13px;
        }

        .card a {
            display: block;
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-5">
            <h2 style="margin:0; color:gold;">Ghibli Films</h2>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MOVIES -->
    <section class="section">
        <h3>Movies</h3>

        <div class="cards" id="movieContainer"></div>
    </section>

    <script>
        const endpoint = "https://ghibliapi.vercel.app/films/";
        const container = document.getElementById("movieContainer");

        const pages = {
            "My Neighbors the Yamadas": "Yamadas.html",
            "Castle in the Sky": "Castle.html",
            "Whisper of the Heart": "whisper.html",
            "Spirited Away": "spirited.html",
            "Princess Mononoke": "Princess.html",
            "The Cat Returns": "Cat.html",
            "When Marnie Was There": "Marnie.html",
            "Kiki's Delivery Service": "kiki's.html",
            "Only Yesterday": "yesterday.html",
            "Porco Rosso": "porco.html",
            "Ponyo": "ponyo.html",
            "Howl's Moving Castle": "howls.html",
            "Earwig and the Witch": "earwig_witch.html",
            "My Neighbor Totoro": "totoro.html",
            "Arrietty": "arrietty.html",
            "The Red Turtle": "turtle.html",
            "Tales from Earthsea": "Earthsea.html",
            "Grave of the Fireflies": "Grave.html",
            "The Wind Rises": "wind.html",
            "Pom Poko": "poko.html",
            "From Up on Poppy Hill": "poppy_hill.html",
            "The Tale of the Princess Kaguya": "Princess_kaguya.html"


        };

        fetch(endpoint)
            .then(res => res.json())
            .then(data => {

                container.innerHTML = "";

                data.forEach(movie => {

                    const card = document.createElement("div");
                    card.className = "card";

                    let page = pages[movie.title] || "#";

                    card.innerHTML = `
                    <a href="${page}">
                        <div class="card-content">
                            <img src="${movie.image}">
                            <h4>${movie.title}</h4>
                        </div>
                    </a>
                `;

                    container.appendChild(card);
                });

            })
            .catch(err => console.log(err));
    </script>

</body>

</html>
