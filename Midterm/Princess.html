<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Princess Mononoke</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #0f2f3a;
            color: white;
            font-family: Poppins;
        }

        .hero {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 380px;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 0;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .details-box {
            border-radius: 12px;
            padding: 18px;
            transition: 0.3s;
        }

        /* LIGHT MODE */
        body[data-bs-theme="light"] .details-box {
            background: white;
            color: black;
        }

        /* DARK MODE */
        body[data-bs-theme="dark"] .details-box {
            background: #08202a;
            color: white;
        }

        .nav-link-custom {
            color: white;
            text-decoration: none;
        }

        .nav-link-custom:hover {
            color: gold;
        }

        .hero-text {
            position: absolute;
            top: 0;
            left: 0;
            padding: 16px;
            max-width: 600px;
        }

        #popularList {
            scrollbar-width: none;
        }

        #popularList::-webkit-scrollbar {
            display: none;
        }

        #popularList img {
            width: 120px;
            height: 280px;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.3s;
        }

        #popularList img:hover {
            transform: scale(1.05);
        }

        body[data-bs-theme="light"] {
            background: #f5f5f5;
            color: black;
        }

        body[data-bs-theme="dark"] {
            background: #0f2f3a;
            color: white;
        }

        /* NAVBAR */
        body[data-bs-theme="light"] .navbar {
            background: white !important;
            border-bottom: 1px solid #ddd;
        }

        body[data-bs-theme="dark"] .navbar {
            background: #08202a !important;
        }

        .nav-link-custom {
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        body[data-bs-theme="light"] .nav-link-custom {
            color: black;
        }

        body[data-bs-theme="dark"] .nav-link-custom {
            color: white;
        }

        .nav-link-custom:hover {
            color: gold;
        }

        .btn {
            background: gold;
            color: black;
            font-weight: 600;
            border: none;
        }

        .btn {
            background: #d4af37;
        }
    </style>

</head>

<body id="body" data-bs-theme="light">

    <nav class="navbar navbar-expand-lg px-4"">
        <div class=" container-fluid">

        <a class="navbar-brand fw-bold fs-3" href="#" style="color:gold;">
            Ghibli Films
        </a>

        <div class="d-flex align-items-center gap-4 ms-auto">
            <a href="index.html" class="nav-link-custom">Home</a>
            <a href="Movies.html" class="nav-link-custom">Movies</a>
        </div>

        <button id="modeBtn" onclick="switchTheme()" class="btn btn-maroon text-white shadow me-3">
            Dark Mode
        </button>

        </div>
    </nav>

    <div class="container-fluid py-4">

        <div class="row g-4 align-items-start">

            <!-- LEFT -->
            <div class="col-md-auto ms-4">

                <div style="width:300px;">

                    <a href="Movies.html" class="text-warning text-decoration-none d-block mb-2">←</a>

                    <img id="poster" class="w-100 rounded" style="height:380px; object-fit:cover;">

                    <div class="details-box mt-3">
                        <h6 class="text-warning">Details</h6>

                        <p class="mb-1"><span class="text-secondary">Director:</span> <span id="director"></span></p>
                        <p class="mb-1"><span class="text-secondary">Producer:</span> <span id="producer"></span></p>
                        <p class="mb-1"><span class="text-secondary">Release:</span> <span id="release"></span></p>
                        <p class="mb-0"><span class="text-secondary">Runtime:</span> <span id="runtime"></span> min</p>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->
            <div class="col d-flex flex-column" style="margin-top:50px;">

                <div class="hero">

                    <img id="heroImage">

                    <div class="overlay"></div>

                    <div class="hero-text">

                        <div id="title" class="h1 fw-bold"></div>

                        <div id="subtitle" class="h5 text-warning"></div>

                        <div id="description" class="p text-light mt-2"></div>

                        <div id="rating" class="h5 mt-2"></div>

                        <a href="https://www.youtube.com/watch?v=BU--ttm4nYs?" class="btn btn-warning mt-3 fw-semibold"
                            target="_blank">
                            ▶ Watch Movie
                        </a>
                    </div>

                </div>

                <!-- TRAILER + POPULAR -->
                <div class="row mt-4">

                    <div class="col-md-8">
                        <h3 style="color:gold;">Trailer</h3>

                        <iframe width="100%" height="315" src="https://www.youtube.com/embed/vf6c6n35wr4?"
                            allowfullscreen></iframe>
                    </div>

                    <div class="col-md-4">
                        <h3 style="color:gold;">Popular</h3>

                        <div id="popularList" style="
                            display:flex;
                            gap:12px;
                            overflow-x:auto;
                            height:315px;
                            align-items:flex-start;
                            padding-bottom:10px;
                            scrollbar-width:none;
                        "></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        async function loadMovie() {

            const res = await fetch("https://ghibliapi.vercel.app/films");
            const films = await res.json();

            const film = films.find(movie => movie.title === "Princess Mononoke");

            poster.src = film.image;
            heroImage.src = film.movie_banner;
            title.textContent = film.title;
            description.textContent = film.description;

            subtitle.innerHTML =
                `${film.release_date} / Animation / ${film.running_time} min`;

            rating.innerHTML =
                `⭐⭐⭐⭐⭐ ${film.rt_score}/100`;

            director.textContent = film.director;
            producer.textContent = film.producer;
            release.textContent = film.release_date;
            runtime.textContent = film.running_time;

            const popular = films.slice(0, 6);

            popular.forEach(movie => {

                let fileName = "#";

                if (movie.title === "Only Yesterday") {
                    fileName = "yesterday.html";
                }

                else if (movie.title === "My Neighbor Totoro") {
                    fileName = "totoro.html";
                }

                else if (movie.title === "Grave of the Fireflies") {
                    fileName = "Grave.html";
                }

                else if (movie.title === "Kiki's Delivery Service") {
                    fileName = "kiki's.html";
                }

                else if (movie.title === "Castle in the Sky") {
                    fileName = "Castle.html";
                }

                else if (movie.title === "Porco Rosso") {
                    fileName = "porco.html";
                }

                popularList.innerHTML += `
        <a href="${fileName}">
            <img src="${movie.image}" alt="${movie.title}">
        </a>
    `;
            });
        }

        loadMovie();

        var body = document.getElementById("body");
        var modeBtn = document.getElementById("modeBtn");

        var mode = body.getAttribute("data-bs-theme") === "dark" ? "Dark" : "Light";
        modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

        function switchTheme() {
            if (mode == "light") {
                mode = "dark";
                modeBtn.innerText = "Light Mode";
            } else {
                mode = "light";
                modeBtn.innerText = "Dark Mode";
            }

            body.setAttribute("data-bs-theme", mode);
        }
        body.setAttribute("data-bs-theme", mode.toLowerCase());
    </script>

</body>

</html>
