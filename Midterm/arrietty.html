<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Arrietty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #0f2f3a;
            color: white;
            font-family: Poppins;
        }

        .hero {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 455px;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .details-box {
            background: #08202a;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* optional scrollbar hide */
        #popularList::-webkit-scrollbar {
            display: none;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <div
        style="display:flex; justify-content:space-between; align-items:center; padding:15px 30px; background:#08202a;">
        <h2 style="margin:0; color:gold;">Ghibli Films</h2>

        <div>
            <a href="index.html" style="color:white; margin-right:20px; text-decoration:none;">Home</a>
            <a href="#" style="color:white; margin-right:20px; text-decoration:none;">Movies</a>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container-fluid py-4">

        <div class="row g-4 align-items-start">

            <!-- LEFT -->
            <div class="col-md-auto ms-4">

                <a href="#" class="text-warning text-decoration-none d-block mb-2">←</a>

                <div style="width:300px;">
                    <img id="poster" class="img-fluid rounded d-block w-100">

                    <div class="details-box mt-3 w-100">
                        <h6 class="text-warning">Details</h6>

                        <p class="mb-1"><span class="text-secondary">Director:</span> <span id="director"></span></p>
                        <p class="mb-1"><span class="text-secondary">Producer:</span> <span id="producer"></span></p>
                        <p class="mb-1"><span class="text-secondary">Release:</span> <span id="release"></span></p>
                        <p class="mb-0"><span class="text-secondary">Runtime:</span> <span id="runtime"></span> min</p>
                    </div>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-md-auto ms-5">

                <div class="hero position-relative" style="margin-top: 36px;">
                    <img id="heroImage" class="w-100 rounded" style="height:515px; object-fit:cover;">
                    <div class="overlay"></div>

                    <div class="position-absolute top-0 start-0 p-4" style="max-width:600px;">
                        <h1 id="title" class="fw-bold mt-5"></h1>
                        <h5 id="subtitle" class="text-warning"></h5>
                        <p id="description" class="text-light mt-3"></p>
                        <h5 id="rating" class="mt-3"></h5>

                        <a href="#" class="btn btn-warning mt-3 fw-semibold">
                            ▶ Watch Movie
                        </a>
                    </div>
                </div>

                <!-- TRAILER + POPULAR -->
                <div class="row mt-4">

                    <!-- TRAILER -->
                    <div class="col-md-8">
                        <h3 style="margin:0 0 10px 0; color:gold;">Trailer</h3>

                        <iframe width="100%" height="315" src="https://www.youtube.com/embed/KzBBIBSi2Vo"
                            frameborder="0" allowfullscreen></iframe>
                    </div>

                    <div id="popularList" style="
                    display:flex;
                    gap:12px;
                    overflow-x:auto;
                    height:315px;
                    align-items:center;
                    padding-bottom:10px;
                    "></div>
                </div>

            </div>

        </div>

    </div>

    </div>

    <script>
        async function loadMovie() {
            try {
                const res = await fetch("https://ghibliapi.vercel.app/films");
                const films = await res.json();

                const film = films.find(f => f.title === "Arrietty");

                document.getElementById("poster").src = film.image;
                document.getElementById("heroImage").src = film.movie_banner;
                document.getElementById("title").textContent = film.title;
                document.getElementById("description").textContent = film.description;

                document.getElementById("subtitle").innerHTML =
                    film.release_date + " / Animation / " + film.running_time + " min";

                document.getElementById("rating").innerHTML =
                    "⭐⭐⭐⭐⭐ " + film.rt_score + "/100";

                document.getElementById("director").textContent = film.director;
                document.getElementById("producer").textContent = film.producer;
                document.getElementById("release").textContent = film.release_date;
                document.getElementById("runtime").textContent = film.running_time;

                // POPULAR FIXED
                const popular = films
                    .sort((a, b) => b.rt_score - a.rt_score)
                    .slice(0, 6);

                const list = document.getElementById("popularList");

                popular.forEach(movie => {
                    const img = document.createElement("img");
                    img.src = movie.image;
                    img.alt = movie.title;

                    img.style.width = "120px";
                    img.style.height = "100%";   // 👈 fill container height
                    img.style.objectFit = "cover";
                    img.style.borderRadius = "12px";
                    img.style.flexShrink = "0";
                    img.style.cursor = "pointer";
                    img.style.transition = "0.3s";

                    img.onmouseover = () => img.style.transform = "scale(1.05)";
                    img.onmouseout = () => img.style.transform = "scale(1)";

                    list.appendChild(img);
                });

            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener("DOMContentLoaded", loadMovie);
    </script>

</body>

</html>
