<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/checkout.css">
<title>Checkout | Likhana</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

</head>
<body>

<header>
    <div class="brand">Likhana Jewelry</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="bracelets.html">Shop</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
    <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <a href="addtocart.html" class="cart-icon" title="Shopping Cart">🛒</a>
</header>

<div class="checkout-container">
    <h1>Checkout</h1>

    <!-- Billing & Shipping Form -->
    <form class="checkout-form">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@email.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="09123456789" required>

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Street, Building, Unit" required>

        <label for="city">City</label>
        <input type="text" id="city" placeholder="City" required>

        <label for="state">State/Province</label>
        <input type="text" id="state" placeholder="State" required>

        <label for="zip">ZIP Code</label>
        <input type="text" id="zip" placeholder="1234" required>

        <label for="payment">Card Number</label>
        <input type="text" id="payment" placeholder="1234 5678 9012 3456" required>

        <label for="expiry">Expiry Date</label>
        <input type="text" id="expiry" placeholder="MM/YY" required>

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" placeholder="123" required>

        <button type="submit">Place Order</button>
    </form>

    <!-- Order Summary -->
    <div class="order-summary">
        <h2>Order Summary</h2>
        <div class="order-item"><span>Golden Charm</span><span>₱499</span></div>
        <div class="order-item"><span>Rose Gold Chain</span><span>₱549</span></div>
        <div class="total">Total: ₱1048</div>
        <a href="addtocart.html" class="back-cart">← Back to Cart</a>
    </div>

</div>

</body>

</html>
