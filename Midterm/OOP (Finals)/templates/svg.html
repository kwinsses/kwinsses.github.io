


</head>
<body>
    <link rel="stylesheet" href="../css/svg.css">
  <div class="card">
    <h1>Ring + Color Wheel</h1>
    <p>Pick a color below and the ring will update in real time.</p>
    <div class="ring-frame">
      <svg viewBox="0 0 220 220" aria-label="Ring with color overlay">
        <defs>
          <radialGradient id="ringGradient" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="55%" stop-color="#d5d8ff" />
            <stop offset="100%" stop-color="#7a83ff" />
          </radialGradient>
          <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </feMerge>
        </defs>
        <circle cx="110" cy="110" r="84" fill="none" stroke="#2b366d" stroke-width="4" opacity="0.35"/>
        <path id="ringPath" d="M 110 35 C 165 35, 205 75, 205 130 C 205 185, 165 225, 110 225 C 55 225, 15 185, 15 130 C 15 75, 55 35, 110 35 Z M 110 60 C 70 60, 40 90, 40 130 C 40 170, 70 200, 110 200 C 150 200, 180 170, 180 130 C 180 90, 150 60, 110 60 Z" fill="url(#ringGradient)" stroke="#1f2f72" stroke-width="2" filter="url(#blurGlow)" />
        <path id="ringTint" d="M 110 35 C 165 35, 205 75, 205 130 C 205 185, 165 225, 110 225 C 55 225, 15 185, 15 130 C 15 75, 55 35, 110 35 Z M 110 60 C 70 60, 40 90, 40 130 C 40 170, 70 200, 110 200 C 150 200, 180 170, 180 130 C 180 90, 150 60, 110 60 Z" fill="#6a75ff" opacity="0.28" />
        <ellipse cx="110" cy="125" rx="45" ry="18" fill="rgba(255,255,255,0.7)" />
        <polygon points="110,20 125,55 110,90 95,55" fill="#fff" stroke="#a6b0ff" stroke-width="1" />
      </svg>
    </div>
    <div class="controls">
      <label for="colorWheel">Color wheel:</label>
      <input id="colorWheel" type="color" value="#6a75ff" />
      <span class="color-value" id="colorValue">#6A75FF</span>
    </div>
    <small>Move the color wheel to change ring color overlay.</small>
  </div>

  <script src="../js/svg.js"></script>

</body>

</html>
