<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Castle in the Sky</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #0f2f3a;
            color: white;
            font-family: Poppins;
        }

        .navbar-custom {
            background: #08202a;
        }

        .hero {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 455px;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .details-box {
            background: #08202a;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        #popularList::-webkit-scrollbar {
            display: none;
        }

        #popularList img {
            width: 120px;
            height: 280px;
            object-fit: cover;
            object-position: center;
            border-radius: 12px;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.3s;
        }

        #popularList img:hover {
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg px-4" style="background:#08202a;">
        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold fs-3" href="#" style="color:gold;">
                Ghibli Films
            </a>

            <!-- LINKS -->
            <div class="d-flex gap-4">
                <a href="index.html" class="nav-link-custom">Home</a>
                <a href="Movies.html" class="nav-link-custom">Movies</a>
            </div>

        </div>
    </nav>

    <style>
        .nav-link-custom {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link-custom:hover {
            color: gold;
        }
    </style>

    <!-- CONTENT -->
    <div class="container-fluid py-4">

        <div class="row g-4 align-items-start">

            <!-- LEFT -->
            <div class="col-md-auto ms-4">

                <a href="Movies.html" class="text-warning text-decoration-none d-block mb-2">←</a>

                <div style="width:300px;">
                    <img id="poster" class="img-fluid rounded d-block w-100">

                    <div class="details-box mt-3 w-100">
                        <h6 class="text-warning">Details</h6>

                        <p class="mb-1"><span class="text-secondary">Director:</span> <span id="director"></span></p>
                        <p class="mb-1"><span class="text-secondary">Producer:</span> <span id="producer"></span></p>
                        <p class="mb-1"><span class="text-secondary">Release:</span> <span id="release"></span></p>
                        <p class="mb-0"><span class="text-secondary">Runtime:</span> <span id="runtime"></span> min</p>
                    </div>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="col-md-auto ms-5">

                <div class="hero position-relative" style="margin-top: 36px;">
                    <img id="heroImage" class="w-80 rounded" style="height:515px; object-fit:cover;">
                    <div class="overlay"></div>

                    <div class="position-absolute top-0 start-0 p-4" style="max-width:600px;">
                        <h1 id="title" class="fw-bold mt-5"></h1>
                        <h5 id="subtitle" class="text-warning"></h5>
                        <p id="description" class="text-light mt-3"></p>
                        <h5 id="rating" class="mt-3"></h5>

                        <a href="https://www.youtube.com/watch?v=FTGVH-W2ntc?" class="btn btn-warning mt-3 fw-semibold"
                            target="_blank" rel="noopener noreferrer">
                            ▶ Watch Movie
                        </a>
                    </div>
                </div>

                <!-- TRAILER + POPULAR -->
                <div class="row mt-4">

                    <!-- TRAILER -->
                    <div class="col-md-8">
                        <h3 style="margin:0 0 10px 0; color:gold;">Trailer</h3>

                        <iframe width="100%" height="315"
                            src="https://www.youtube.com/embed/8ykEy-yPBFc?si=z0bk03j3Y13AkCmo" frameborder="0"
                            allowfullscreen></iframe>
                    </div>

                    <div class="col-md-4">
                        <h3 style="color:gold;">Popular</h3>

                        <div id="popularList" style="
                            display:flex;
                            gap:12px;
                            overflow-x:auto;
                            height:315px;
                            align-items:center;
                            padding-bottom:10px;
                        "></div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        async function loadMovie() {

            const res = await fetch("https://ghibliapi.vercel.app/films");
            const films = await res.json();

            const film = films.find(movie => movie.title === "Castle in the Sky");

            poster.src = film.image;
            heroImage.src = film.movie_banner;
            title.textContent = film.title;
            description.textContent = film.description;

            subtitle.innerHTML =
                `${film.release_date} / Animation / ${film.running_time} min`;

            rating.innerHTML =
                `⭐⭐⭐⭐⭐ ${film.rt_score}/100`;

            director.textContent = film.director;
            producer.textContent = film.producer;
            release.textContent = film.release_date;
            runtime.textContent = film.running_time;

            // Popular Movies
            const popular = films
                .sort((a, b) => b.rt_score - a.rt_score)
                .slice(0, 6);

            popular.forEach(movie => {

                let fileName = "#";

                if (movie.title === "Only Yesterday") {
                    fileName = "yesterday.html";
                }

                else if (movie.title === "The Tale of the Princess Kaguya") {
                    fileName = "Princess_kaguya.html";
                }

                else if (movie.title === "Grave of the Fireflies") {
                    fileName = "Grave.html";
                }

                else if (movie.title === "Kiki's Delivery Service") {
                    fileName = "kiki's.html";
                }

                else if (movie.title === "Castle in the Sky") {
                    fileName = "Castle.html";
                }

                popularList.innerHTML += `
        <a href="${fileName}">
            <img src="${movie.image}" alt="${movie.title}">
        </a>
    `;
            });
        }

        loadMovie();
    </script>

</body>

</html>
