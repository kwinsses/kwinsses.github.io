<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghibli</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f2f3a;
            color: #fff;
        }

        /* NAVBAR */
        .navbar {
            position: absolute;
            width: 100%;
            z-index: 10;
            background-color: #0f2f3a !important;
        }

        .navbar-brand {
            color: #d4af37 !important;
            font-weight: 600;
        }

        .nav-link {
            color: #fff !important;
        }

        .nav-link:hover {
            color: #d4af37 !important;
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .form-control {
            background-color: #143c4a;
            border: 1px solid #d4af37;
            color: #fff;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .btn-outline-success {
            color: #d4af37;
            border-color: #d4af37;
        }

        .btn-outline-success:hover {
            background-color: #d4af37;
            color: #0f2f3a;
        }

        .hero {
            height: 100vh;
            background: url("https://image.tmdb.org/t/p/original/etqr6fOOCXQOgwrQXaKwenTSuzx.jpg") no-repeat center/cover;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h2 {
            font-size: 50px;
            margin: 10px 0;
        }

        .btn {
            padding: 12px 25px;
            background: #d4af37;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #b8860b;
        }

        .section {
            padding: 60px;
            background: #143c4a;
        }

        .section h3 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            color: black;
            border-radius: 15px;
            width: 220px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h4 {
            font-size: 14px;
        }

        .card a {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .not-found {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #d4af37;
            display: none;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Studio Ghibli</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarScroll">

                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="Movies.html">Movies</a>
                    </li>

                </ul>

                <!-- SEARCH -->
                <form class="d-flex" role="search" onsubmit="return false;">
                    <input id="searchInput" class="form-control me-2" type="search" placeholder="Search movies...">
                    <button class="btn btn-outline-success" type="button" onclick="searchMovies()">Search</button>

                </form>

            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-text">
            <h2>My Neighbor TOTORO</h2>
            <button class="btn" onclick="location.href='totoro.html'">
                Watch Movies
            </button>
        </div>
    </section>

    <!-- MOVIES -->
    <section class="section">

        <h3>Suggested Movies</h3>

        <div class="cards">

            <div class="card">
                <a href="Yamadas.html">
                    <div class="card-content" id="yamadas"></div>
                </a>
            </div>

            <div class="card">
                <a href="Castle.html">
                    <div class="card-content" id="castle"></div>
                </a>
            </div>

            <div class="card">
                <a href="whisper.html">
                    <div class="card-content" id="whisper"></div>
                </a>
            </div>

            <div class="card">
                <a href="spirited.html">
                    <div class="card-content" id="spirited"></div>
                </a>
            </div>

        </div>

        <div class="not-found" id="notFound">❌ Movie not found</div>

    </section>

    <script>
        async function loadMovies() {
            const res = await fetch("https://ghibliapi.vercel.app/films/");
            const movies = await res.json();

            const map = {
                yamadas: "My Neighbors the Yamadas",
                castle: "Castle in the Sky",
                whisper: "Whisper of the Heart",
                spirited: "Spirited Away"
            };

            Object.keys(map).forEach(id => {
                const movie = movies.find(m =>
                    m.title.toLowerCase() === map[id].toLowerCase()
                );

                if (movie) {
                    const imgSrc = (id === "yamadas" || id === "castle")
                        ? movie.movie_banner
                        : movie.image;

                    document.getElementById(id).innerHTML = `
                        <img src="${imgSrc}" alt="${movie.title}">
                        <h4>${movie.title}</h4>
                    `;
                }
            });
        }

        function searchMovies() {
            const input = document.getElementById("searchInput").value.toLowerCase().trim();

            const movies = {
                "my neighbors the yamadas": "Yamadas.html",
                "castle in the sky": "Castle.html",
                "whisper of the heart": "whisper.html",
                "spirited away": "spirited.html",
                "princess mononoke": "Princess.html",
                "the cat returns": "Cat.html",
                "when marnie was there": "Marnie.html",
                "kiki's delivery service": "kiki's.html",
                "only yesterday": "yesterday.html",
                "porco rosso": "porco.html",
                "ponyo": "ponyo.html",
                "howl's moving castle": "howls.html",
                "earwig and the witch": "earwig_witch.html",
                "my neighbor totoro": "totoro.html",
                "arrietty": "arrietty.html",
                "the red turtle": "turtle.html",
                "tales from earthsea": "Earthsea.html",
                "grave of the fireflies": "Grave.html",
                "the wind rises": "wind.html",
                "pom poko": "poko.html",
                "from up on poppy hill": "poppy_hill.html",
                "the tale of the princess kaguya": "Princess_kaguya.html"
            };

            const notFound = document.getElementById("notFound");

            let found = false;

            for (let title in movies) {
                if (title.includes(input) && input !== "") {
                    found = true;
                    window.location.href = movies[title];
                    break;
                }
            }

            if (!found && input !== "") {
                notFound.style.display = "block";

                setTimeout(() => {
                    notFound.style.display = "none";
                }, 2000);
            }
        }



        document.addEventListener("DOMContentLoaded", loadMovies);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
