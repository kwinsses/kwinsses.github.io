<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibli</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f2f3a;
            color: #fff;
        }

        /* NAVBAR */
        .navbar {
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        /* HERO */
        .hero {
            height: 100vh;
            background: url("https://image.tmdb.org/t/p/original/etqr6fOOCXQOgwrQXaKwenTSuzx.jpg") no-repeat center/cover;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h2 {
            font-size: 50px;
            margin: 10px 0;
        }

        .btn {
            padding: 12px 25px;
            background: #d4af37;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #b8860b;
        }

        /* BOX SECTION */
        .section {
            padding: 60px;
            background: #143c4a;
        }

        .section h3 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            color: black;
            border-radius: 15px;
            width: 220px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h4 {
            font-size: 14px;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="#">Ghibli World</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-text">
            <h2>My Neighbor TOTORO</h2>
            <button class="btn">Watch Movies</button>
        </div>
    </section>

    <section class="section">

        <h3>Featured Ghibli Movies</h3>

        <div class="cards">

            <div class="card">
                <div class="card-content">
                    <h4>Spirited Away</h4>
                </div>
            </div>

            <div class="card">
                <div class="card-content">
                    <h4>My Neighbor Totoro</h4>
                </div>
            </div>

            <div class="card">
                <div class="card-content">
                    <h4>Howl’s Moving Castle</h4>
                </div>
            </div>

            <div class="card">
                <div class="card-content">
                    <h4>Princess Mononoke</h4>
                </div>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
