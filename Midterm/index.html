<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghibli</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f2f3a;
            color: #fff;
        }

        .navbar {
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .hero {
            height: 100vh;
            background: url("https://image.tmdb.org/t/p/original/etqr6fOOCXQOgwrQXaKwenTSuzx.jpg") no-repeat center/cover;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h2 {
            font-size: 50px;
            margin: 10px 0;
        }

        .btn {
            padding: 12px 25px;
            background: #d4af37;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #b8860b;
        }

        .section {
            padding: 60px;
            background: #143c4a;
        }

        .section h3 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            color: black;
            border-radius: 15px;
            width: 220px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card-content h4 {
            font-size: 14px;
        }

        .card a {
            display: block;
            text-decoration: none;
            color: inherit;
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-5">
            <h2 style="margin:0; color:gold;">Ghibli Films</h2>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Movies.html">Movies</a></li>
                </ul>

                <form class="d-flex ms-3">
                    <input class="form-control me-2 search-input" type="search" placeholder="Search movies...">
                    <button class="btn">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-text">
            <h2>My Neighbor TOTORO</h2>
            <button class="btn">Watch Movies</button>
        </div>
    </section>

    <!-- MOVIES -->
    <section class="section">

        <h3>Suggested Movies</h3>

        <div class="cards">

            <!-- CARD 1 -->
            <div class="card">
                <a href="Yamadas.html">
                    <div class="card-content">
                        <img src="https://image.tmdb.org/t/p/original/nDOsicEg4RHDq0t23JKGSb58z6u.jpg">
                        <h4>My Neighbors the Yamadas</h4>
                    </div>
                </a>
            </div>

            <!-- CARD 2 -->
            <div class="card">
                <a href="Castle.html">
                    <div class="card-content">
                        <img src="https://image.tmdb.org/t/p/w533_and_h300_bestv2/3cyjYtLWCBE1uvWINHFsFnE8LUK.jpg">
                        <h4>Castle in the Sky</h4>
                    </div>
                </a>
            </div>

            <!-- CARD 3 -->
            <div class="card">
                <a href="whisper.html">
                    <div class="card-content">
                        <img src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/5E3Hvbu0bg38ouYf6chGftVGqZ7.jpg">
                        <h4>Whisper of the Heart</h4>
                    </div>
                </a>
            </div>

            <!-- CARD 4 -->
            <div class="card">
                <a href="spirited.html">
                    <div class="card-content">
                        <img src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/39wmItIWsg5sZMyRUHLkWBcuVCM.jpg">
                        <h4>Spirited Away</h4>
                    </div>
                </a>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
